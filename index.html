<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AESTHETIX - Ultra Sleek & Evil UX</title>
  <style>
    :root {
      --bg-color: #0a0b10;
      --card-bg: rgba(23, 25, 35, 0.6);
      --accent-glow: #6366f1;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 背景のスタイリッシュなグラデーションオーブ */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.5;
    }
    .orb-1 {
      width: 400px;
      height: 400px;
      background: var(--accent-glow);
      top: -100px;
      left: -100px;
    }
    .orb-2 {
      width: 350px;
      height: 350px;
      background: var(--accent-pink);
      bottom: -100px;
      right: -100px;
    }

    /* メインカード */
    .card {
      position: relative;
      z-index: 1;
      width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* 電話番号カウントアップ */
    .phone-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 16px;
    }

    .phone-display {
      flex: 1;
      font-family: monospace;
      font-size: 18px;
      letter-spacing: 2px;
      text-align: center;
      color: #38bdf8;
    }

    .btn-step {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }
    .btn-step:active {
      transform: scale(0.9);
      background: var(--accent-glow);
    }

    /* 年齢スライダー */
    .slider-wrapper {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
    }

    .slider-val {
      text-align: right;
      font-size: 14px;
      color: var(--accent-pink);
      font-weight: bold;
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-pink);
      cursor: pointer;
    }

    /* 利用規約 */
    .terms-box {
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: var(--text-muted);
      overflow-y: scroll;
      border: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.5;
    }

    /* 逃走ボタンエリア */
    .submit-area {
      position: relative;
      height: 60px;
      margin-top: 32px;
    }

    .btn-submit {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--accent-glow), var(--accent-pink));
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: top 0.15s ease, left 0.15s ease;
    }

    /* 寸止めオーバーレイ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 11, 16, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .progress-bar {
      width: 300px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 20px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-glow), var(--accent-pink));
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="header">
      <h1>AESTHETIX</h1>
      <p>次世代プレミアムアカウントの作成</p>
    </div>

    <!-- 電話番号（カウントアップ方式） -->
    <div class="form-group">
      <label>電話番号 (090-XXXX-XXXX)</label>
      <div class="phone-control">
        <button class="btn-step" onclick="changePhone(-1)">-</button>
        <div class="phone-display" id="phoneDisplay">00000000000</div>
        <button class="btn-step" onclick="changePhone(1)">+</button>
      </div>
    </div>

    <!-- 年齢（高難易度スライダー） -->
    <div class="form-group">
      <label>年齢選択</label>
      <div class="slider-wrapper">
        <div class="slider-val"><span id="ageVal">0.00</span> 歳</div>
        <input type="range" id="ageInput" min="0" max="120" step="0.01" value="0" oninput="updateAge(this.value)">
      </div>
    </div>

    <!-- 利用規約（あまのじゃくスクロール） -->
    <div class="form-group">
      <label>利用規約</label>
      <div class="terms-box" id="termsBox">
        当サービスの利用規約へようこそ。本規約を最後まで熟読してください。<br><br>
        第1条（目的）本規約は、完璧に美しい見た目と最悪の操作性を備えたアプリケーションの利用条件を定めるものです。<br><br>
        第2条（同意）ユーザーはスクロールバーを最下部までスクロールしない限り、同意ボタンを押すことができません。<br><br>
        第3条（忍耐）いかなるイライラにも耐えうる精神を維持してください。<br><br>
        --- 規約の終わり ---
      </div>
    </div>

    <!-- 逃避する送信ボタン -->
    <div class="submit-area" id="submitArea">
      <button class="btn-submit" id="submitBtn">アカウントを作成する</button>
    </div>
  </div>

  <!-- 寸止めローディング画面 -->
  <div class="overlay" id="overlay">
    <h2 style="font-size: 20px; font-weight: 500;">処理中...</h2>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p id="statusText" style="margin-top: 12px; font-size: 12px; color: var(--text-muted);">暗号化通信を確立しています (0%)</p>
  </div>

  <script>
    // 1. 電話番号（カウントアップ）
    let phoneNumber = 0;
    function changePhone(delta) {
      phoneNumber = Math.max(0, phoneNumber + delta);
      document.getElementById('phoneDisplay').textContent = String(phoneNumber).padStart(11, '0');
    }

    // 2. 年齢スライダー
    function updateAge(val) {
      document.getElementById('ageVal').textContent = parseFloat(val).toFixed(2);
    }

    // 3. あまのじゃくスクロール
    const termsBox = document.getElementById('termsBox');
    termsBox.addEventListener('wheel', (e) => {
      e.preventDefault();
      // ホイール操作と逆に動く（下に回すと上にスクロール）
      termsBox.scrollTop -= e.deltaY * 0.3;
    });

    // 4. マウスから逃げるボタン
    const submitBtn = document.getElementById('submitBtn');
    const submitArea = document.getElementById('submitArea');

    document.addEventListener('mousemove', (e) => {
      const btnRect = submitBtn.getBoundingClientRect();
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      // ボタンの中心とマウスの距離
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;
      const dist = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

      // マウスが80px以内に近づいたらランダムに逃げる
      if (dist < 80) {
        const offsetX = (Math.random() - 0.5) * 200;
        const offsetY = (Math.random() - 0.5) * 100;
        
        submitBtn.style.left = `${offsetX}px`;
        submitBtn.style.top = `${offsetY}px`;
      }
    });

    // 5. 奇跡的に押せた場合の99%寸止めローディング
    submitBtn.addEventListener('click', () => {
      const overlay = document.getElementById('overlay');
      const fill = document.getElementById('progressFill');
      const statusText = document.getElementById('statusText');
      
      overlay.style.display = 'flex';
      let progress = 0;

      const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 99) {
          progress = 99; // 99%で絶対ストップ
          clearInterval(interval);
          fill.style.width = '99%';
          statusText.textContent = 'データ同期中 (99%)...';

          // 5秒後に絶望のエラーを表示
          setTimeout(() => {
            alert('エラー: セッションがタイムアウトしました。最初からやり直してください。');
            location.reload();
          }, 4000);
        } else {
          fill.style.width = `${progress}%`;
          statusText.textContent = `暗号化通信を確立しています (${Math.floor(progress)}%)`;
        }
      }, 200);
    });
  </script>
</body>
</html>

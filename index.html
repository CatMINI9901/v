<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated QR Receiver</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
    video { width: 100%; max-width: 350px; height: auto; border: 2px solid #333; }
    canvas { display: none; }
    #rawLog { background: #ffebee; color: #c62828; padding: 10px; margin: 10px; border: 1px solid #e57373; font-weight: bold; word-break: break-all; }
    #result { background: #e8f5e9; color: #2e7d32; padding: 10px; margin: 10px; border: 1px solid #81c784; font-size: 1.2em; word-break: break-all; }
  </style>
</head>
<body>
  <h2>QR受信カメラ (デバッグ版)</h2>
  <button id="startCamBtn" style="padding: 10px 20px; font-size: 16px;">カメラ起動</button>
  <p id="status">ボタンを押してください</p>

  <video id="video" playsinline></video>
  <canvas id="hiddenCanvas"></canvas>

  <div>
    <strong>▼ カメラが検知した生のデータ:</strong>
    <div id="rawLog">（まだ何も検出していません）</div>
  </div>

  <div>
    <strong>▼ 復元結果:</strong>
    <div id="result">（未完成）</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const rawLog = document.getElementById('rawLog');
    const resultDiv = document.getElementById('result');

    let receivedChunks = {};
    let totalChunks = null;
    let isScanning = false;

    document.getElementById('startCamBtn').addEventListener('click', async () => {
      receivedChunks = {};
      totalChunks = null;
      rawLog.textContent = '（スキャン中...）';
      resultDiv.textContent = '（未完成）';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        video.srcObject = stream;
        await video.play();
        
        isScanning = true;
        status.textContent = 'カメラ動作中！画面にかざしてね';
        requestAnimationFrame(tick);
      } catch (err) {
        alert('エラー: ' + err.name + '\n' + err.message);
      }
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          // 何か読めたら即座に画面に表示！
          rawLog.textContent = code.data;
          parseQRData(code.data);
        }
      }

      if (isScanning) {
        requestAnimationFrame(tick);
      }
    }

    function parseQRData(data) {
      const match = data.match(/^(\d+)\/(\d+):([\s\S]*)$/);
      if (!match) return;

      const current = parseInt(match[1], 10);
      const total = parseInt(match[2], 10);
      const content = match[3];

      totalChunks = total;

      if (!receivedChunks[current]) {
        receivedChunks[current] = content;

        const currentCount = Object.keys(receivedChunks).length;
        status.textContent = `取得済み: ${currentCount} / ${total}`;

        if (currentCount === total) {
          assembleData();
        }
      }
    }

    function assembleData() {
      let fullText = '';
      for (let i = 1; i <= totalChunks; i++) {
        fullText += receivedChunks[i] || '';
      }
      resultDiv.textContent = fullText + ' 🎉(完成！)';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがな名前発掘ツール</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --highlight-bg: #ef4444;
            --highlight-text: #ffffff;
            --row-hit: #fefce8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 9px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .stats strong {
            color: var(--text);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .output-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 520px;
            overflow-y: auto;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .line {
            padding: 2px 6px;
            border-radius: 4px;
            word-break: break-all;
        }

        .line.has-match {
            background-color: var(--row-hit);
        }

        .line-num {
            color: var(--text-muted);
            display: inline-block;
            width: 85px;
            user-select: none;
        }

        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            font-weight: bold;
            padding: 0 4px;
            border-radius: 3px;
        }

        .nav-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 520px;
            display: flex;
            flex-direction: column;
        }

        .nav-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }

        .nav-list {
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            width: 100%;
            padding: 8px 12px;
            background: #f1f5f9;
            border: none;
            border-radius: 6px;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
        }

        .nav-item:hover {
            background: #e2e8f0;
        }

        .flash {
            animation: flash-anim 0.8s ease;
        }

        @keyframes flash-anim {
            0% { background-color: #fde047; }
            100% { background-color: var(--row-hit); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ひらがな名前発掘ツール</h1>
    </header>

    <div class="panel">
        <div class="controls">
            <div class="input-group">
                <label for="target-word">探したい名前</label>
                <input type="text" id="target-word" value="たなか" maxlength="10">
            </div>
            <div class="input-group">
                <label for="generate-count">生成行数 (最大 10,000行)</label>
                <select id="generate-count">
                    <option value="1000">1,000 行</option>
                    <option value="3000">3,000 行</option>
                    <option value="5000">5,000 行</option>
                    <option value="10000" selected>10,000 行</option>
                </select>
            </div>
            <button class="btn-primary" id="btn-run">生成して発掘</button>
        </div>

        <div class="stats">
            <span>総行数: <strong id="stat-generated">0</strong></span>
            <span>ヒット数: <strong id="stat-hits" style="color: #ef4444;">0</strong></span>
        </div>
    </div>

    <div class="main-layout">
        <!-- 左：ランダム文字列出力エリア -->
        <div class="output-box" id="output-screen">設定を入力して「生成して発掘」をクリックしてください。</div>

        <!-- 右：発見行ナビゲーター（何行目か調べられる機能） -->
        <div class="nav-box">
            <div class="nav-header">発見した行一覧</div>
            <div class="nav-list" id="nav-list">
                <div style="color: var(--text-muted); padding: 12px; font-size: 0.85rem;">ここにヒットした行番号が表示されます</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const hiraganaList = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
        const stringLength = 30;

        const btnRun = document.getElementById('btn-run');
        const targetInput = document.getElementById('target-word');
        const countSelect = document.getElementById('generate-count');
        const outputScreen = document.getElementById('output-screen');
        const navList = document.getElementById('nav-list');
        
        const statGenerated = document.getElementById('stat-generated');
        const statHits = document.getElementById('stat-hits');

        btnRun.addEventListener('click', () => {
            const keyword = targetInput.value.trim();
            let maxLines = parseInt(countSelect.value, 10);

            // 上限を10,000行に制限
            if (maxLines > 10000) maxLines = 10000;

            if (!keyword) {
                alert('探したい名前を入力してください');
                return;
            }

            outputScreen.innerHTML = "生成および解析中...";
            navList.innerHTML = "";

            setTimeout(() => {
                let hitCount = 0;
                const rows = [];
                const navItems = [];
                const hLen = hiraganaList.length;

                for (let i = 0; i < maxLines; i++) {
                    const lineNum = i + 1;
                    let randomRow = "";
                    for (let j = 0; j < stringLength; j++) {
                        randomRow += hiraganaList.charAt(Math.floor(Math.random() * hLen));
                    }

                    if (randomRow.includes(keyword)) {
                        const matches = randomRow.split(keyword).length - 1;
                        hitCount += matches;

                        const highlighted = randomRow.split(keyword).join(`<span class="highlight">${keyword}</span>`);
                        rows.push(`<div class="line has-match" id="line-${lineNum}"><span class="line-num">${lineNum}行目:</span>${highlighted}</div>`);
                        navItems.push(`<button class="nav-item" onclick="jumpTo(${lineNum})">${lineNum} 行目で発見</button>`);
                    } else {
                        rows.push(`<div class="line" id="line-${lineNum}"><span class="line-num">${lineNum}行目:</span>${randomRow}</div>`);
                    }
                }

                outputScreen.innerHTML = rows.join('');
                
                if (navItems.length > 0) {
                    navList.innerHTML = navItems.join('');
                } else {
                    navList.innerHTML = `<div style="color: var(--text-muted); padding: 12px; font-size: 0.85rem;">該当する名前は見つかりませんでした</div>`;
                }

                statGenerated.innerText = maxLines.toLocaleString();
                statHits.innerText = hitCount.toLocaleString();
            }, 30);
        });

        window.jumpTo = function(lineNum) {
            const el = document.getElementById(`line-${lineNum}`);
            if (el) {
                el.scrollIntoView({ block: 'center', behavior: 'smooth' });
                el.classList.add('flash');
                setTimeout(() => el.classList.remove('flash'), 800);
            }
        };
    })();
</script>

</body>
</html>

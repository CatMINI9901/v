<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated QR Receiver</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 10px; margin: 0; background: #f0f0f0; }
    #videoContainer { position: relative; display: inline-block; width: 100%; max-width: 400px; background: #000; }
    /* カメラ映像をちゃんと画面に表示するお！ */
    video { width: 100%; height: auto; display: block; }
    canvas { display: none; } /* 解析用キャンバスだけ隠すお */
    #status { font-weight: bold; margin: 10px; color: #0066cc; }
    .progress-bar { width: 90%; max-width: 400px; background: #ccc; height: 16px; margin: 10px auto; border-radius: 8px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.2s; }
    #result { margin: 15px auto; padding: 10px; border: 1px solid #ccc; background: #fff; text-align: left; width: 90%; max-width: 400px; word-break: break-all; min-height: 50px; }
  </style>
</head>
<body>
  <h2>QR受信カメラ</h2>
  <button id="startCamBtn" style="padding: 10px 20px; font-size: 16px;">カメラ起動</button>
  <p id="status">ボタンを押してカメラを起動してね</p>

  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <div id="videoContainer">
    <video id="video" playsinline></video>
  </div>
  <canvas id="hiddenCanvas"></canvas>

  <h3>復元結果:</h3>
  <div id="result">ここに復元されたテキストが出ます</div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const progressFill = document.getElementById('progressFill');

    let receivedChunks = {};
    let totalChunks = null;
    let isScanning = false;
    let isCompleted = false;

    document.getElementById('startCamBtn').addEventListener('click', async () => {
      receivedChunks = {};
      totalChunks = null;
      isCompleted = false;
      resultDiv.textContent = '受信待ち...';
      progressFill.style.width = '0%';

      try {
        // カメラ設定（PCでもスマホでも動くように柔軟に指定）
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', true); // iOS Safari対策
        await video.play();
        
        isScanning = true;
        status.textContent = 'カメラ起動OK！送信画面のQRコードにかざしてね';
        requestAnimationFrame(tick);
      } catch (err) {
        alert('カメラ起動エラー: ' + err.name + '\n' + err.message);
      }
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning && !isCompleted) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          parseQRData(code.data);
        }
      }

      if (isScanning && !isCompleted) {
        requestAnimationFrame(tick);
      }
    }

    function parseQRData(data) {
      const match = data.match(/^(\d+)\/(\d+):([\s\S]*)$/);
      if (!match) return;

      const current = parseInt(match[1], 10);
      const total = parseInt(match[2], 10);
      const content = match[3];

      totalChunks = total;

      if (!receivedChunks[current]) {
        receivedChunks[current] = content;

        const currentCount = Object.keys(receivedChunks).length;
        const percent = Math.floor((currentCount / total) * 100);

        status.textContent = `受信中: ${currentCount} / ${total} コマ (${percent}%)`;
        progressFill.style.width = percent + '%';

        if (currentCount === total) {
          isCompleted = true;
          assembleData();
        }
      }
    }

    function assembleData() {
      let fullText = '';
      for (let i = 1; i <= totalChunks; i++) {
        fullText += receivedChunks[i] || '';
      }
      resultDiv.textContent = fullText;
      status.textContent = '🎉 受信完了！全データを復元したお！';
    }
  </script>
</body>
</html>

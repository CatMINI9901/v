<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Animated QR Receiver (Looping Support)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    video, canvas { display: none; }
    #status { font-weight: bold; font-size: 1.1em; color: #0066cc; }
    #result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; text-align: left; display: inline-block; width: 80%; white-space: pre-wrap; word-break: break-all; }
    .progress-bar { width: 80%; background: #e0e0e0; height: 20px; margin: 10px auto; border-radius: 10px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.2s; }
  </style>
</head>
<body>
  <h2>QRデータ受信画面（ループ・コマ落ち対応）</h2>
  <button id="startCamBtn">カメラ起動</button>
  <p id="status">停止中</p>

  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <video id="video" playsinline></video>
  <canvas id="hiddenCanvas"></canvas>

  <h3>復元結果:</h3>
  <div id="result">データを受信していません</div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const progressFill = document.getElementById('progressFill');

    let receivedChunks = {}; // 取得済みコマのバッファ { 1: "内容", 3: "内容", ... }
    let totalChunks = null;
    let isScanning = false;
    let isCompleted = false;

    document.getElementById('startCamBtn').addEventListener('click', async () => {
      // 初期化
      receivedChunks = {};
      totalChunks = null;
      isCompleted = false;
      resultDiv.textContent = '受信中...';
      progressFill.style.width = '0%';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        video.play();
        isScanning = true;
        status.textContent = 'スキャン中... QRコードにかざしてください（読み飛ばしても次のループで補完します）';
        requestAnimationFrame(tick);
      } catch (err) {
        alert('カメラの起動に失敗しました: ' + err);
      }
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning && !isCompleted) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          parseQRData(code.data);
        }
      }

      if (isScanning && !isCompleted) {
        requestAnimationFrame(tick);
      }
    }

    function parseQRData(data) {
      // フォーマットチェック "コマ番号/総コマ数:データ"
      const match = data.match(/^(\d+)\/(\d+):([\s\S]*)$/);
      if (!match) return;

      const current = parseInt(match[1], 10);
      const total = parseInt(match[2], 10);
      const content = match[3];

      totalChunks = total;

      // 1. まだ持ってないコマだった場合のみ追加保存するお！
      if (!receivedChunks[current]) {
        receivedChunks[current] = content;

        const currentCount = Object.keys(receivedChunks).length;
        const percent = Math.floor((currentCount / total) * 100);

        // UI更新
        status.textContent = `受信中: ${currentCount} / ${total} コマ獲得 (${percent}%) - 読み残しはループで回収中`;
        progressFill.style.width = percent + '%';

        // 2. 抜け漏れなく全コマが揃ったか判定するお！
        if (currentCount === total) {
          isCompleted = true;
          assembleData();
        }
      }
    }

    function assembleData() {
      // コマ番号（1〜total）の順に結合して完成させるお！
      let fullText = '';
      for (let i = 1; i <= totalChunks; i++) {
        fullText += receivedChunks[i] || '';
      }
      resultDiv.textContent = fullText;
      status.textContent = '🎉 全コマの回収が完了しました！データを復元しました。';
      
      // カメラ停止
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    }
  </script>
</body>
</html>

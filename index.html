<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限ひらがな・名前発掘ジェネレーター XP</title>
    <style>
        /* Windows XP (Luna Blue) 風デザイン */
        :root {
            --xp-blue-dark: #002e99;
            --xp-blue-mid: #0056e0;
            --xp-blue-light: #3a93ff;
            --xp-bg: #ece9d8;
            --xp-window-border: #0054e3;
        }

        body {
            /* XPのデスクトップ背景（青空）をイメージしたグラデーション */
            background: linear-gradient(to bottom, #7abcff 0%, #60abf8 44%, #4c9be8 100%);
            font-family: "MS UI Gothic", "Segoe UI", sans-serif;
            font-size: 13px;
            color: #000000;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }

        /* XPスタイルのウィンドウ */
        .window {
            background-color: var(--xp-bg);
            border: 3px solid var(--xp-window-border);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
        }

        /* あの特徴的な青いタイトルバー */
        .title-bar {
            background: linear-gradient(to bottom, #0058e6 0%, #3a93ff 8%, #0056e0 88%, #002e99 100%);
            color: #ffffff;
            padding: 5px 8px;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 1px #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        /* 懐かしい赤色の「×」ボタン */
        .btn-close {
            background: linear-gradient(to bottom, #e76049 0%, #b82d14 100%);
            border: 1px solid #7c1a0a;
            border-radius: 3px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            width: 21px;
            height: 21px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-close:active {
            background: linear-gradient(to bottom, #b82d14 0%, #e76049 100%);
        }

        .content {
            padding: 12px;
        }

        /* 設定パネル */
        fieldset {
            border: 1px solid #919b9c;
            border-radius: 4px;
            margin-bottom: 12px;
            padding: 12px;
            background-color: #f1efe2;
        }

        legend {
            font-weight: bold;
            color: #003c74;
            padding: 0 6px;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            color: #333;
        }

        input, select {
            padding: 4px;
            border: 1px solid #7f9db9;
            background-color: #ffffff;
            font-size: 14px;
        }

        /* XP風の立体感のあるメインボタン */
        button.btn-execute {
            background: linear-gradient(to bottom, #ffffff 0%, #eaeaea 30%, #dcdcdc 70%, #cecece 100%);
            border: 1px solid #003c74;
            border-radius: 3px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 1px 0 #fff;
            color: #000;
        }
        button.btn-execute:hover {
            background: linear-gradient(to bottom, #fff4cc 0%, #ffdf99 100%);
            border-color: #ff9900;
        }
        button.btn-execute:active {
            background: linear-gradient(to bottom, #dcdcdc 0%, #ffffff 100%);
        }

        /* ステータスバー */
        .status-bar {
            border: 1px solid #919b9c;
            padding: 6px;
            margin-bottom: 12px;
            background-color: #e5e2d3;
            display: flex;
            gap: 20px;
            font-weight: bold;
        }

        /* 画面分割レイアウト */
        .main-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 12px;
        }
        @media (max-width: 650px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 左側：メイン出力画面 */
        .output-container {
            border: 1px solid #7f9db9;
            background-color: #ffffff;
            height: 380px;
            overflow-y: scroll;
            padding: 6px;
            font-family: "MS Gothic", monospace;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* 右側：何行目か調べられる奴（ナビゲーター） */
        .navigator-container {
            border: 1px solid #7f9db9;
            background-color: #fbfbfa;
            height: 380px;
            display: flex;
            flex-direction: column;
        }
        .navigator-header {
            background-color: #dedbc7;
            padding: 6px;
            font-weight: bold;
            border-bottom: 1px solid #919b9c;
            color: #003c74;
            text-align: center;
        }
        .navigator-list {
            overflow-y: auto;
            flex-grow: 1;
            padding: 4px;
        }
        .nav-item {
            display: block;
            width: 100%;
            padding: 4px 6px;
            margin-bottom: 2px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 2px;
            text-align: left;
            cursor: pointer;
            font-size: 12px;
        }
        .nav-item:hover {
            background-color: #316ac5;
            color: #ffffff;
            border-color: #316ac5;
        }

        /* ハイライト表現 */
        .highlight {
            background-color: #ff3333;
            color: #ffffff;
            font-weight: bold;
            padding: 0 2px;
        }

        .line-number {
            color: #999999;
            font-size: 12px;
            margin-right: 8px;
            display: inline-block;
            width: 50px;
        }

        .row-data {
            padding: 1px 4px;
            transition: background-color 0.5s;
        }
        .row-data.hit {
            background-color: #fff2bf;
        }
        
        /* ジャンプした時に一瞬光らせるエフェクト */
        .row-data.flash {
            background-color: #ff9900 !important;
            color: white;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>🔍 NAME_SEARCH_EXPLORER.EXE</span>
        <button class="btn-close" tabindex="-1">X</button>
    </div>
    
    <div class="content">
        <fieldset>
            <legend>発掘パラメータ</legend>
            <div class="control-panel">
                <div class="input-group">
                    <label for="target-word">探したい名前:</label>
                    <input type="text" id="target-word" value="たなか" maxlength="10">
                </div>
                <div class="input-group">
                    <label for="generate-count">生成行数:</label>
                    <select id="generate-count">
                        <option value="1000">1,000 行</option>
                        <option value="5000">5,000 行</option>
                        <option value="10000" selected>10,000 行</option>
                        <option value="30000">30,000 行</option>
                    </select>
                </div>
                <button class="btn-execute" id="btn-run">発掘を開始する</button>
            </div>
        </fieldset>

        <div class="status-bar">
            <span id="stat-generated">生成: 0 行</span>
            <span id="stat-hits" style="color: #c00000;">発見数: 0 個</span>
        </div>

        <!-- 画面分割レイアウト -->
        <div class="main-layout">
            <!-- 左：文字列出力 -->
            <div class="output-container" id="output-screen">ここに30文字の文字列が大量出力されます。</div>
            
            <!-- 右：何行目か調べられる奴 -->
            <div class="navigator-container">
                <div class="navigator-header">🎯 発見した行の一覧</div>
                <div class="navigator-list" id="nav-list">
                    <div style="color:#888; text-align:center; padding-top:20px; font-size:12px;">ここにヒットした行番号が並びます</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const hiraganaList = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
        const stringLength = 30;

        const btnRun = document.getElementById('btn-run');
        const targetInput = document.getElementById('target-word');
        const countSelect = document.getElementById('generate-count');
        const outputScreen = document.getElementById('output-screen');
        const navList = document.getElementById('nav-list');
        
        const statGenerated = document.getElementById('stat-generated');
        const statHits = document.getElementById('stat-hits');

        btnRun.addEventListener('click', () => {
            const targetWord = targetInput.value.trim();
            const totalLines = parseInt(countSelect.value, 10);

            if (!targetWord) {
                alert('名前を入力してください。');
                return;
            }

            outputScreen.innerHTML = "生成およびインデックス解析中...";
            navList.innerHTML = "";

            setTimeout(() => {
                executeMining(targetWord, totalLines);
            }, 50);
        });

        function executeMining(keyword, maxLines) {
            let hitCount = 0;
            const fragmentStrings = [];
            const navButtons = [];
            const hLen = hiraganaList.length;

            for (let i = 0; i < maxLines; i++) {
                const lineNumber = i + 1;
                let randomRow = "";
                for (let j = 0; j < stringLength; j++) {
                    randomRow += hiraganaList.charAt(Math.floor(Math.random() * hLen));
                }

                if (randomRow.includes(keyword)) {
                    const matches = randomRow.split(keyword).length - 1;
                    hitCount += matches;

                    // 行ごとの一意のID（jump-target-行番号）を設定
                    const highlighted = randomRow.split(keyword).join(`<span class="highlight">${keyword}</span>`);
                    fragmentStrings.push(`<div class="row-data hit" id="jump-target-${lineNumber}"><span class="line-number">[行:${lineNumber}]</span>${highlighted}</div>`);
                    
                    // 右側の「何行目か調べられる奴」リスト用のボタン要素を生成
                    navButtons.push(`<button class="nav-item" onclick="window.jumpToLine(${lineNumber})">⚡ ${lineNumber}行目で発見！</button>`);
                } else {
                    fragmentStrings.push(`<div class="row-data" id="jump-target-${lineNumber}"><span class="line-number">[行:${lineNumber}]</span>${randomRow}</div>`);
                }
            }

            // 画面への一括反映
            outputScreen.innerHTML = fragmentStrings.join('');
            
            if (navButtons.length > 0) {
                navList.innerHTML = navButtons.join('');
            } else {
                navList.innerHTML = `<div style="color:#888; text-align:center; padding-top:20px; font-size:12px;">1つも見つかりませんでした</div>`;
            }

            // カウンター更新
            statGenerated.innerText = `生成: ${maxLines.toLocaleString()} 行`;
            statHits.innerText = `発見数: ${hitCount.toLocaleString()} 個`;
        }

        // 指定の行番号へスクロール＆フラッシュさせる関数をグローバルに展開
        window.jumpToLine = function(num) {
            const targetElement = document.getElementById(`jump-target-${num}`);
            if (targetElement) {
                // 左の出力画面内でスクロール移動
                targetElement.scrollIntoView({ block: 'center', behavior: 'smooth' });
                
                // どこにジャンプしたか分かりやすくするために一瞬オレンジ色に光らせる
                targetElement.classList.add('flash');
                setTimeout(() => {
                    targetElement.classList.remove('flash');
                }, 800);
            }
        };
    })();
</script>

</body>
</html>
